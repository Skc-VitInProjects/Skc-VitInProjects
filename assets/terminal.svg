<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="280" rx="10" fill="#0A1020" stroke="#1E2C4E"/>
  <rect width="900" height="32" rx="10" fill="#0F1830"/>
  <rect y="22" width="900" height="10" fill="#0F1830"/>
  <circle cx="22" cy="16" r="5.5" fill="#FF5F57"/>
  <circle cx="42" cy="16" r="5.5" fill="#FEBC2E"/>
  <circle cx="62" cy="16" r="5.5" fill="#28C840"/>
  <text x="450" y="21" text-anchor="middle" font-family="'Cascadia Code','Courier New',monospace" font-size="12" fill="#5C6B8A">skand@dev-os: ~/about</text>

  <g font-family="'Cascadia Code','Courier New',monospace" font-size="14">
    <text x="24" y="66"><tspan fill="#39FFB0">$</tspan> <tspan fill="#E7ECFB">whoami --engineering-philosophy</tspan></text>
    <text x="24" y="98" fill="#B8C4E0">Build for the person operating the system, not just the</text>
    <text x="24" y="120" fill="#B8C4E0">demo. Verify assumptions with tests and edge cases before</text>
    <text x="24" y="142" fill="#B8C4E0">calling a feature done.</text>

    <text x="24" y="176"><tspan fill="#39FFB0">$</tspan> <tspan fill="#E7ECFB">cat current_focus.txt</tspan></text>
    <text x="24" y="200" fill="#8FA6FF">→ Deepening system design and distributed-systems fundamentals</text>
    <text x="24" y="222" fill="#8FA6FF">→ Shipping production-grade REST APIs and real-time features</text>

    <text x="24" y="254"><tspan fill="#39FFB0">$</tspan> <tspan fill="#E7ECFB">_</tspan></text>
    <rect x="70" y="243" width="8" height="15" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
