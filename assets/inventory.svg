<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="invGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#B24BF3"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="360" fill="#060A14" rx="12"/>
  <text x="30" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#E7ECFB">Developer Inventory</text>
  <text x="30" y="54" font-family="'Cascadia Code','Courier New',monospace" font-size="11" fill="#5C6B8A">4 equipped loadouts · sorted by category</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Languages -->
    <g transform="translate(30,72)">
      <rect width="460" height="120" rx="10" fill="#0D1424" stroke="#1E2C4E"/>
      <rect width="4" height="120" fill="url(#invGrad)"/>
      <text x="20" y="26" font-size="12" fill="#5C6B8A">LANGUAGES</text>
      <text x="20" y="50" font-size="14" fill="#E7ECFB">JavaScript (ES6+)</text>
      <text x="20" y="72" font-size="14" fill="#E7ECFB">TypeScript</text>
      <text x="20" y="94" font-size="14" fill="#E7ECFB">Java</text>
    </g>
    <!-- Frameworks -->
    <g transform="translate(510,72)">
      <rect width="460" height="120" rx="10" fill="#0D1424" stroke="#1E2C4E"/>
      <rect width="4" height="120" fill="url(#invGrad)"/>
      <text x="20" y="26" font-size="12" fill="#5C6B8A">FRAMEWORKS &amp; LIBRARIES</text>
      <text x="20" y="50" font-size="14" fill="#E7ECFB">React.js · Redux Toolkit</text>
      <text x="20" y="72" font-size="14" fill="#E7ECFB">Node.js · Express.js</text>
      <text x="20" y="94" font-size="14" fill="#E7ECFB">Passport.js · Mongoose · Joi</text>
    </g>
    <!-- Services -->
    <g transform="translate(30,204)">
      <rect width="460" height="120" rx="10" fill="#0D1424" stroke="#1E2C4E"/>
      <rect width="4" height="120" fill="url(#invGrad)"/>
      <text x="20" y="26" font-size="12" fill="#5C6B8A">SERVICES &amp; INFRASTRUCTURE</text>
      <text x="20" y="50" font-size="14" fill="#E7ECFB">MongoDB · MySQL</text>
      <text x="20" y="72" font-size="14" fill="#E7ECFB">Clerk · Inngest · Cloudinary</text>
      <text x="20" y="94" font-size="14" fill="#E7ECFB">Vercel</text>
    </g>
    <!-- Tools -->
    <g transform="translate(510,204)">
      <rect width="460" height="120" rx="10" fill="#0D1424" stroke="#1E2C4E"/>
      <rect width="4" height="120" fill="url(#invGrad)"/>
      <text x="20" y="26" font-size="12" fill="#5C6B8A">TOOLS &amp; UTILITIES</text>
      <text x="20" y="50" font-size="14" fill="#E7ECFB">Git · GitHub · Postman</text>
      <text x="20" y="72" font-size="14" fill="#E7ECFB">Hoppscotch · Multer</text>
      <text x="20" y="94" font-size="14" fill="#E7ECFB">ExcelJS · PDFKit · Vitest</text>
    </g>
  </g>
</svg>
