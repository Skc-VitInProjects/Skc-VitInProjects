<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#4C6FFF"/>
    </linearGradient>
    <linearGradient id="barGradAlt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C6FFF"/>
      <stop offset="100%" stop-color="#B24BF3"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" fill="#060A14" rx="12"/>
  <text x="40" y="48" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#E7ECFB">Skill Tree — Engineering Domains</text>
  <text x="40" y="70" font-family="'Cascadia Code','Courier New',monospace" font-size="12" fill="#5C6B8A">progression measured against production-level fluency</text>

  <!-- trunk -->
  <circle cx="70" cy="130" r="10" fill="#00E5FF"/>
  <line x1="70" y1="130" x2="70" y2="470" stroke="#1E2C4E" stroke-width="2"/>

  <!-- rows: label, pct, tier -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
    <!-- Programming -->
    <line x1="70" y1="120" x2="120" y2="120" stroke="#1E2C4E" stroke-width="2"/>
    <text x="130" y="115" fill="#E7ECFB">Programming (JS/TS, Java, DSA)</text>
    <rect x="130" y="122" width="500" height="10" rx="5" fill="#0F1830"/>
    <rect x="130" y="122" width="440" height="10" rx="5" fill="url(#barGrad)"/>
    <text x="642" y="131" fill="#8DA0C4" font-size="12">Advanced</text>

    <!-- Frontend -->
    <line x1="70" y1="170" x2="120" y2="170" stroke="#1E2C4E" stroke-width="2"/>
    <text x="130" y="165" fill="#E7ECFB">Frontend Engineering (React)</text>
    <rect x="130" y="172" width="500" height="10" rx="5" fill="#0F1830"/>
    <rect x="130" y="172" width="410" height="10" rx="5" fill="url(#barGrad)"/>
    <text x="642" y="181" fill="#8DA0C4" font-size="12">Proficient</text>

    <!-- Backend -->
    <line x1="70" y1="220" x2="120" y2="220" stroke="#1E2C4E" stroke-width="2"/>
    <text x="130" y="215" fill="#E7ECFB">Backend Engineering (Node/Express)</text>
    <rect x="130" y="222" width="500" height="10" rx="5" fill="#0F1830"/>
    <rect x="130" y="222" width="450" height="10" rx="5" fill="url(#barGrad)"/>
    <text x="642" y="231" fill="#8DA0C4" font-size="12">Advanced</text>

    <!-- Database -->
    <line x1="70" y1="270" x2="120" y2="270" stroke="#1E2C4E" stroke-width="2"/>
    <text x="130" y="265" fill="#E7ECFB">Databases (MongoDB / MySQL)</text>
    <rect x="130" y="272" width="500" height="10" rx="5" fill="#0F1830"/>
    <rect x="130" y="272" width="380" height="10" rx="5" fill="url(#barGrad)"/>
    <text x="642" y="281" fill="#8DA0C4" font-size="12">Proficient</text>

    <!-- Cloud -->
    <line x1="70" y1="320" x2="120" y2="320" stroke="#1E2C4E" stroke-width="2"/>
    <text x="130" y="315" fill="#E7ECFB">Cloud (Vercel, AWS)</text>
    <rect x="130" y="322" width="500" height="10" rx="5" fill="#0F1830"/>
    <rect x="130" y="322" width="220" height="10" rx="5" fill="url(#barGradAlt)"/>
    <text x="642" y="331" fill="#8DA0C4" font-size="12">Developing</text>

    <!-- DevOps -->
    <line x1="70" y1="370" x2="120" y2="370" stroke="#1E2C4E" stroke-width="2"/>
    <text x="130" y="365" fill="#E7ECFB">DevOps (Docker, CI/CD)</text>
    <rect x="130" y="372" width="500" height="10" rx="5" fill="#0F1830"/>
    <rect x="130" y="372" width="170" height="10" rx="5" fill="url(#barGradAlt)"/>
    <text x="642" y="381" fill="#8DA0C4" font-size="12">Exploring</text>

    <!-- System Design -->
    <line x1="70" y1="420" x2="120" y2="420" stroke="#1E2C4E" stroke-width="2"/>
    <text x="130" y="415" fill="#E7ECFB">System Design</text>
    <rect x="130" y="422" width="500" height="10" rx="5" fill="#0F1830"/>
    <rect x="130" y="422" width="260" height="10" rx="5" fill="url(#barGradAlt)"/>
    <text x="642" y="431" fill="#8DA0C4" font-size="12">Developing</text>

    <!-- Open Source -->
    <line x1="70" y1="460" x2="120" y2="460" stroke="#1E2C4E" stroke-width="2"/>
    <text x="130" y="465" fill="#E7ECFB">Open Source</text>
    <rect x="130" y="472" width="500" height="10" rx="5" fill="#0F1830"/>
    <rect x="130" y="472" width="140" height="10" rx="5" fill="url(#barGradAlt)"/>
    <text x="642" y="481" fill="#8DA0C4" font-size="12">Early</text>
  </g>
</svg>
