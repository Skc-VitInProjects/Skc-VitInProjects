<svg xmlns="http://www.w3.org/2000/svg"
     width="1400"
     height="900"
     viewBox="0 0 1400 900">

    <defs>

        <!-- ================= Colors ================= -->

        <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="50%" stop-color="#06B6D4"/>
            <stop offset="100%" stop-color="#22D3EE"/>
        </linearGradient>

        <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8B5CF6"/>
            <stop offset="50%" stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#4F46E5"/>
        </linearGradient>

        <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F59E0B"/>
            <stop offset="50%" stop-color="#FBBF24"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>

        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <!-- ========================================================= -->
    <!-- Divider 1 -->
    <!-- ========================================================= -->

    <g transform="translate(0,50)">

        <line
            x1="80"
            y1="0"
            x2="1320"
            y2="0"
            stroke="url(#gradBlue)"
            stroke-width="4"
            filter="url(#glow)"/>

        <circle cx="700" cy="0" r="12"
                fill="#06B6D4"/>

        <circle cx="700" cy="0" r="22"
                fill="none"
                stroke="#06B6D4"
                stroke-width="2"/>

    </g>

    <!-- ========================================================= -->
    <!-- Divider 2 -->
    <!-- ========================================================= -->

    <g transform="translate(0,220)">

        <line
            x1="100"
            y1="0"
            x2="500"
            y2="0"
            stroke="url(#gradPurple)"
            stroke-width="3"/>

        <line
            x1="900"
            y1="0"
            x2="1300"
            y2="0"
            stroke="url(#gradPurple)"
            stroke-width="3"/>

        <polygon
            points="680,-18 700,-36 720,-18 720,18 700,36 680,18"
            fill="#8B5CF6"/>

        <circle
            cx="700"
            cy="0"
            r="8"
            fill="white"/>

    </g>

    <!-- ========================================================= -->
    <!-- Divider 3 -->
    <!-- ========================================================= -->

    <g transform="translate(0,390)">

        <line
            x1="80"
            y1="0"
            x2="1320"
            y2="0"
            stroke="url(#gradGold)"
            stroke-width="3"/>

        <rect
            x="620"
            y="-14"
            width="160"
            height="28"
            rx="14"
            fill="#111827"
            stroke="#FBBF24"
            stroke-width="2"/>

        <text
            x="700"
            y="8"
            font-size="16"
            font-family="Segoe UI"
            fill="#FBBF24"
            text-anchor="middle">
            LEVEL UP
        </text>

    </g>

    <!-- ========================================================= -->
    <!-- Divider 4 -->
    <!-- ========================================================= -->

    <g transform="translate(0,560)">

        <line
            x1="80"
            y1="0"
            x2="1320"
            y2="0"
            stroke="#334155"
            stroke-width="2"/>

        <circle cx="500" cy="0" r="5" fill="#38BDF8"/>
        <circle cx="600" cy="0" r="5" fill="#38BDF8"/>
        <circle cx="700" cy="0" r="5" fill="#38BDF8"/>
        <circle cx="800" cy="0" r="5" fill="#38BDF8"/>
        <circle cx="900" cy="0" r="5" fill="#38BDF8"/>

    </g>

    <!-- ========================================================= -->
    <!-- Divider 5 -->
    <!-- ========================================================= -->

    <g transform="translate(0,730)">

        <line
            x1="120"
            y1="0"
            x2="1280"
            y2="0"
            stroke="url(#gradBlue)"
            stroke-width="2"/>

        <polygon
            points="700,-25 715,-5 740,0 715,5 700,25 685,5 660,0 685,-5"
            fill="#22D3EE"
            filter="url(#glow)"/>

    </g>

</svg>
