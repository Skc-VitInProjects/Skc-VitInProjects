<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#101d42"/>
    </linearGradient>

    <!-- Accent -->

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- XP -->

    <linearGradient id="xp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow -->

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->

  <rect width="1600" height="420" fill="url(#bg)"/>

  <!-- Grid -->

  <g opacity="0.12">

    <path d="M0 40 H1600"/>
    <path d="M0 80 H1600"/>
    <path d="M0 120 H1600"/>
    <path d="M0 160 H1600"/>
    <path d="M0 200 H1600"/>
    <path d="M0 240 H1600"/>
    <path d="M0 280 H1600"/>
    <path d="M0 320 H1600"/>
    <path d="M0 360 H1600"/>

    <path d="M80 0 V420"/>
    <path d="M160 0 V420"/>
    <path d="M240 0 V420"/>
    <path d="M320 0 V420"/>
    <path d="M400 0 V420"/>
    <path d="M480 0 V420"/>
    <path d="M560 0 V420"/>
    <path d="M640 0 V420"/>
    <path d="M720 0 V420"/>
    <path d="M800 0 V420"/>
    <path d="M880 0 V420"/>
    <path d="M960 0 V420"/>
    <path d="M1040 0 V420"/>
    <path d="M1120 0 V420"/>
    <path d="M1200 0 V420"/>
    <path d="M1280 0 V420"/>
    <path d="M1360 0 V420"/>
    <path d="M1440 0 V420"/>
    <path d="M1520 0 V420"/>

    <animate attributeName="opacity"
             values="0.08;0.18;0.08"
             dur="8s"
             repeatCount="indefinite"/>

  </g>

  <!-- Border -->

  <rect
      x="18"
      y="18"
      width="1564"
      height="384"
      rx="18"
      fill="none"
      stroke="url(#accent)"
      stroke-width="3"
      filter="url(#glow)"/>

  <!-- HUD -->

  <text
      x="70"
      y="70"
      fill="#22d3ee"
      font-size="24"
      font-family="Consolas, monospace">

      STATUS : ONLINE

      <animate attributeName="opacity"
               values="1;.5;1"
               dur="2s"
               repeatCount="indefinite"/>

  </text>

  <!-- NAME -->

  <text
      x="70"
      y="150"
      fill="white"
      font-size="58"
      font-weight="700"
      font-family="Segoe UI">

      SKAND KUMAR CHOUBEY

  </text>

  <!-- TITLE -->

  <text
      x="70"
      y="195"
      fill="#8ab4ff"
      font-size="28"
      font-family="Segoe UI">

      Full Stack Engineer • Backend Developer • MERN Stack

  </text>

  <!-- XP -->

  <text
      x="70"
      y="255"
      fill="#d1d5db"
      font-size="22"
      font-family="Consolas">

      LEVEL 21

  </text>

  <rect
      x="70"
      y="280"
      width="640"
      height="18"
      rx="9"
      fill="#1f2937"/>

  <rect
      x="70"
      y="280"
      width="0"
      height="18"
      rx="9"
      fill="url(#xp)">

      <animate
          attributeName="width"
          from="0"
          to="585"
          dur="2.2s"
          fill="freeze"/>

  </rect>

  <text
      x="730"
      y="295"
      fill="#22d3ee"
      font-size="18"
      font-family="Consolas">

      XP 91%

  </text>

  <!-- STATS PANEL -->

  <rect
      x="1120"
      y="55"
      width="390"
      height="300"
      rx="15"
      fill="#0f172acc"
      stroke="#22d3ee"
      stroke-width="2"/>

  <text
      x="1155"
      y="95"
      fill="#22d3ee"
      font-size="24"
      font-family="Consolas">

      CHARACTER

  </text>

  <text
      x="1155"
      y="135"
      fill="white"
      font-size="20"
      font-family="Consolas">

      Class ........ Software Engineer

  </text>

  <text
      x="1155"
      y="170"
      fill="white"
      font-size="20"
      font-family="Consolas">

      Guild ........ VIT Bhopal

  </text>

  <text
      x="1155"
      y="205"
      fill="white"
      font-size="20"
      font-family="Consolas">

      Users ........ 1000+

  </text>

  <text
      x="1155"
      y="240"
      fill="white"
      font-size="20"
      font-family="Consolas">

      CGPA ......... 9.15

  </text>

  <text
      x="1155"
      y="275"
      fill="white"
      font-size="20"
      font-family="Consolas">

      DSA .......... 260+

  </text>

  <text
      x="1155"
      y="310"
      fill="#22d3ee"
      font-size="20"
      font-family="Consolas">

      STATUS ....... READY

  </text>

  <!-- Decorative nodes -->

  <circle cx="930" cy="120" r="5" fill="#22d3ee">
      <animate attributeName="r"
               values="5;8;5"
               dur="3s"
               repeatCount="indefinite"/>
  </circle>

  <circle cx="990" cy="180" r="5" fill="#22d3ee">
      <animate attributeName="r"
               values="5;8;5"
               dur="4s"
               repeatCount="indefinite"/>
  </circle>

  <circle cx="1040" cy="240" r="5" fill="#22d3ee">
      <animate attributeName="r"
               values="5;8;5"
               dur="5s"
               repeatCount="indefinite"/>
  </circle>

  <line x1="930" y1="120" x2="990" y2="180"
        stroke="#22d3ee"
        opacity=".5"/>

  <line x1="990" y1="180" x2="1040" y2="240"
        stroke="#22d3ee"
        opacity=".5"/>

</svg>
